# Acceptable-use policy cases, evaluated by tests/unit/test_policy.py.
#
#   input        text to evaluate (YAML escapes such as \U0000200B are used for invisible characters)
#   surface      angel_engine.policy.types.Surface value (default: collection_query)
#   context      optional PolicyContext fields: subject_type, face_count, person_count, restricted_mode
#   expect       expected decision, or a list of acceptable decisions
#   categories   categories that must all be present (subset check)
#   categories_any  at least one of these categories must be present
#
# D01–D28 are the required Appendix D cases; the rest are benign look-alikes, evasions,
# multilingual refusals and investigation-purpose checks.

# ------------------------------------------------------------------ Appendix D
