# Angel Engine acceptable-use rule pack.
#
# Loaded with yaml.safe_load and validated by angel_engine.policy.rulepack. Each rule has:
#   id         two letters + three digits (FI-001 …), unique
#   category   an angel_engine.policy.types.Category value
#   strength   hard (cannot be lowered by the optional classifier) | soft
#   decision   allow | warn | review | refuse
#   conditions all / any / none lists of terms. A term is a label string ("intent:track"), or
#              {labels: [...]}, {phrases: [...]}, {lexicon: name}, {pattern: regex}, or a nested
#              {all|any|none: [...]} group. Phrases are normalized like the input; "*" matches one token.
#   rationale  calm, specific, never echoes the request text
#   notice     optional notice shown with the decision
#   surfaces   optional list of surfaces the rule is limited to
#
# Benign overrides are expressed as `none:` conditions. Labels come from
# angel_engine.policy.annotate (KNOWN_LABELS); relation labels such as data:contact@person mean the
# data item is attached to a subject of that kind.

