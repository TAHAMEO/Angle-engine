[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angel-engine"
version = "0.1.0"
description = "Angel Engine — lawful, privacy-first OSINT evidence management platform (backend)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[postgresql-asyncpg]>=2.1.1,<2.2",
  "alembic>=1.20,<1.21",
  "asyncpg>=0.31",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "argon2-cffi>=25.1",
  "pyotp>=2.10",
  "qrcode>=8.2",
  "cryptography>=50",
  "redis>=8.1",
  "structlog>=26.1",
  "pyyaml>=6.0.3",
  "snowballstemmer>=3.1",
  # Outbound HTTP for connectors. Pinned exactly: SafeHttpClient installs a guarded
  # network backend on httpcore's connection pool (see infra/http/safe_client.py).
  "httpx==0.28.1",
  "httpcore==1.0.9",
  "protego>=0.7",
  "trafilatura>=2.2",
  "w3lib>=2.5",
  "pypdf>=6.19",
  "dnspython>=2.8",
  "tldextract>=5.3.2",
  "phonenumbers>=9.0.40",
  "shapely>=2.1.2",
  "jinja2>=3.1.6",
  "pillow>=12.3",
  "imagehash>=4.3.2",
  "pytesseract>=0.3.13",
  "opencv-python-headless>=5.0.0.93",
  "numpy>=2.4",
  "defusedxml>=0.7.1",
  "anthropic>=1.11,<2",
]

[project.optional-dependencies]
pdf = ["weasyprint>=70"]
heif = ["pillow-heif>=1.8"]       # pillow-heif wheels bundle GPL-licensed x265; opt-in only.
s3 = ["boto3>=1.43"]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "respx>=0.23.1",
  "ruff>=0.16",
  "mypy>=2.4",
  "types-PyYAML",
]

[project.scripts]
angel-engine = "angel_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
angel_engine = [
  "legal/*.md",
  "policy/rules/*.yaml",
  "data/*",
  "models/*",
  "reports/templates/*",
  "osint/fixtures/**/*",
  "py.typed",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL", "C4", "PIE", "T20"]
ignore = [
  "PLR0913",  # many arguments: explicit service signatures are intentional
  "PLR0917",  # FastAPI endpoints take many query parameters
  "PLR2004",  # magic values in comparisons
  "PLR0911", "PLR0912", "PLR0915",
  "S101",     # asserts are used for internal invariants and in tests
  "RUF001", "RUF002", "RUF003",  # unicode in strings (arrows, dashes) is intentional
  "B008",     # FastAPI Depends() in defaults
  "PLC0415",  # local imports (used to keep optional/heavy deps lazy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "T20", "B"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: requires the local PostgreSQL test cluster",
  "slow: slower tests (OCR, model inference)",
]
filterwarnings = [
  "error::DeprecationWarning:angel_engine.*",
]

[tool.coverage.run]
source = ["angel_engine"]
branch = true
