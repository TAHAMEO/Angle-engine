# ClamAV daemon for Angel Engine (zINSTREAM over TCP from the analysis worker).
Foreground yes
LogTime yes
LogVerbose no
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
# Uploads are at most 25 MiB; anything larger must never come back "OK, not scanned".
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 120M
AlertExceedsMax yes
AlertBrokenMedia yes
AlertBrokenExecutables yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertOLE2Macros yes
AlertPartitionIntersection yes
HeuristicAlerts yes
HeuristicScanPrecedence yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
