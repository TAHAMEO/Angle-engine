# Offline demo on https://localhost (Caddy's internal CA): recorded connector responses, the offline demo AI,
# the development malware scanner and the fixture face detector. Never use this override in production.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml up -d --build
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml run --rm api angel-engine seed-demo
x-demo-env: &demo-env
  ANGEL_ENV: development
  ANGEL_CONNECTOR_MODE: fixtures
  ANGEL_AI_PROVIDER: fake
  ANGEL_SCANNER: builtin
  ANGEL_FACE_DETECTOR: fixture

services:
  keys-init:
    environment: *demo-env
  migrate:
    environment: *demo-env
  api:
    environment: *demo-env
  worker-analysis:
    environment: *demo-env
  worker-egress:
    environment: *demo-env
  caddy:
    environment:
      ANGEL_TLS_DIRECTIVE: tls internal
    # The demo's credentials are public: reachable from this machine only.
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
