name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM_PACKAGES: >-
    postgresql-16 redis-server tesseract-ocr tesseract-ocr-eng
    libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System packages (PostgreSQL 16, Redis, Tesseract, Pango)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - name: Install
        run: make setup
      - name: Start PostgreSQL and Redis (local cluster on :54329, as in development)
        run: make services
      - name: Lint and format
        run: |
          backend/.venv/bin/ruff check backend/src backend/tests
          backend/.venv/bin/ruff format --check backend/src backend/tests
      - name: Type-check
        run: make typecheck
      - name: Migrations apply and match the models
        working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: OpenAPI snapshot is current
        run: |
          backend/.venv/bin/angel-engine openapi --output "$RUNNER_TEMP/openapi.json"
          diff -u frontend/openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Tests
        run: make test

  web:
    name: Web client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated API types match openapi.json
        run: pnpm check:api
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright, axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $SYSTEM_PACKAGES
      - name: Install backend
        run: make setup
      - name: Install web client and Chromium
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build the web client and run the suite
        run: make e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  deployment:
    name: Deployment images and offline demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANGEL_DOMAIN: localhost
      COMPOSE: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.demo.yml
    steps:
      - uses: actions/checkout@v5
      - name: Pre-flight checks (as make up / make demo run them)
        run: deploy/preflight.sh
      - name: Throw-away secrets for this run
        run: deploy/generate-secrets.sh
      - name: Validate the Compose files
        run: make compose-config
      - name: Build the images
        run: $COMPOSE build
      - name: Start the demo stack
        run: |
          $COMPOSE up -d
          for _ in $(seq 1 60); do
            curl -fsSk https://localhost/api/v1/health/ready >/dev/null 2>&1 && break
            sleep 5
          done
      - name: Load the demo data (runs image analysis in the sandbox inside the container)
        run: $COMPOSE run --rm api angel-engine seed-demo
      - name: Smoke-test through Caddy
        run: |
          curl -fsSk https://localhost/api/v1/health/ready | tee /dev/stderr | grep -q '"status":"ok"'
          headers=$(curl -fsSk -D - -o /dev/null https://localhost/login)
          echo "$headers"
          grep -qi '^strict-transport-security:' <<<"$headers"
          grep -qi "^content-security-policy:.*'nonce-" <<<"$headers"
          grep -qi '^x-frame-options: DENY' <<<"$headers"
      - name: Sign in through Caddy as a browser does (__Host- cookies, CSRF, Origin, TOTP)
        run: |
          jar=$(mktemp); base=https://localhost/api/v1
          login='{"email":"admin@angel-engine.example","password":"Demo-Harbour-Lantern-2026"}'
          post() { curl -fsSk -b "$jar" -c "$jar" -H 'Origin: https://localhost' -H 'Content-Type: application/json' "$@"; }
          form=$(curl -fsSk -b "$jar" -c "$jar" "$base/auth/csrf" | jq -r .csrf_token)
          post -H "X-CSRF-Token: $form" -d "$login" "$base/auth/login" | jq -e '.state == "mfa_pending"'
          # Start over from the code step: the unfinished sign-in's cookies must not get in the way.
          form=$(curl -fsSk -b "$jar" -c "$jar" "$base/auth/csrf" | jq -r .csrf_token)
          session=$(post -H "X-CSRF-Token: $form" -d "$login" "$base/auth/login" | jq -r .csrf_token)
          # The next time step's code: the seed may have used the current one, and each step works once.
          code=$($COMPOSE exec -T api python -c "import pyotp, time; print(pyotp.TOTP('2RK6JLGRP5COXCL7EMU726X3YH6MNOCZ').at(time.time() + 30))")
          post -H "X-CSRF-Token: $session" -d "{\"code\":\"$code\"}" "$base/auth/mfa/verify" | jq -e '.state == "active"'
          curl -fsSk -b "$jar" "$base/me" | jq -e '.role == "admin"'
          grep -q '__Host-ae_sid' "$jar" && grep -q '__Host-ae_form_csrf' "$jar"
      - name: The analysis worker cannot reach the internet
        run: |
          if $COMPOSE exec -T worker-analysis python -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=5)"; then
            echo "worker-analysis reached the internet" >&2
            exit 1
          fi
      - name: A second copy of the project is told the database is not its own
        run: |
          mv deploy/secrets deploy/secrets.kept
          trap 'mv deploy/secrets.kept deploy/secrets' EXIT
          if deploy/preflight.sh 2>preflight.err; then
            echo "preflight accepted a copy without the database's secrets" >&2
            exit 1
          fi
          grep -q 'make demo-reset' preflight.err
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color --tail=200
      - name: Stop
        if: always()
        run: $COMPOSE down -v
